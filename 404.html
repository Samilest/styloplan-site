<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<script>(function(){try{if(window.top===window.self||window.top.location.origin===location.origin)return}catch(e){}document.documentElement.style.setProperty("display","none","important");try{window.top.location.replace(location.href)}catch(e){}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found · StyloPlan</title>
<script>try{var t=localStorage.getItem("pr-theme");document.documentElement.dataset.theme=t==="light"?"light":"dark"}catch(e){document.documentElement.dataset.theme="dark"}</script>
<style>
  :root { --bg: #16181b; --ink: #ECEAE5; --ink-2: #A9A6A0; --line: #2C3036; --accent: #D1B678; --on-accent: #1A1712; }
  :root[data-theme="light"] { --bg: #F4F2EE; --ink: #1D1F22; --ink-2: #5B5A57; --line: #D8D4CC; --accent: #211E19; --on-accent: #FFFFFF; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
         font: 16px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; padding: 24px 16px; }
  main { max-width: 440px; text-align: center; }
  .mark { display: inline-grid; place-items: center; width: 44px; height: 44px; border-radius: 10px;
          border: 1px solid var(--line); font-weight: 700; margin-bottom: 24px; }
  h1 { font-size: 1.5rem; margin: 0 0 8px; }
  p { color: var(--ink-2); margin: 0 0 24px; }
  .acts { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  a.btn { display: inline-flex; align-items: center; min-height: 44px; padding: 0 18px; border-radius: 8px;
          text-decoration: none; font-weight: 600; border: 1px solid var(--line); color: var(--ink); }
  a.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">SP</div>
  <h1>This page is not here</h1>
  <p>The link may be mistyped or out of date. Your projects are where you left them.</p>
  <div class="acts">
    <a class="btn primary" data-to="projects.html" href="projects.html">Open your projects</a>
    <a class="btn" data-to="index.html" href="index.html">StyloPlan home</a>
  </div>
</main>
<script>
  // WHERE THE SITE STARTS. On a GitHub Pages project site it is the first
  // folder of the path (the repository's name); on a domain of its own it is
  // the root. This page may be shown at any depth, so its links are made
  // from that start rather than from where it happens to be.
  (function () {
    var seg = location.pathname.split('/').filter(Boolean);
    var base = /\.github\.io$/.test(location.hostname) && seg.length ? '/' + seg[0] + '/' : '/';
    document.querySelectorAll('a[data-to]').forEach(function (a) { a.href = base + a.getAttribute('data-to'); });
    var icon = document.createElement('link');
    icon.rel = 'icon'; icon.type = 'image/svg+xml'; icon.href = base + 'assets/mark.svg';
    document.head.append(icon);
  })();
</script>
</body>
</html>
