  // they do: Studio exports whichever the customer picks, in JPG, PNG or PDF,
  // plus the MLS-safe set. Choosing a canvas is a decision made while looking
  // at the plan, which is Studio's job, not a folder of alternatives.
  //
  // What only the pack can do is the whole project in one file — every
  // confirmed floor with its own verification report — and that is what it
  // keeps. Two floors now make four pages instead of eight.
  const all = composeAll({
    planImage: styled,
    labels: v.labels.filter((l) => l.name),
    brand,
    specs: v.specs,
    meta: { title: `${f.name} · ${p.name}` },
  });
  // composeAll orders best-fit first, so the first entry is the strongest
  // canvas for this plan's proportions.
  const best = Object.values(all)[0];
  // The report takes the plan page's size, so the two pages of a floor are one
  // piece of paper rather than two.
  const report = renderVerificationReport({
    kit, projectName: p.name, floorName: f.name, verified: v,
    page: { width: best.width, height: best.height },
  });
  return [best, report];
}

async function loadKitFont(kit) {
  // A project with no brand kit is a real state — the header already renders
  // "no kit" — so this has to survive one rather than throw on kit.font and
  // take the whole download with it.
  const family = kit?.font;
  if (!family) return;
  await Promise.all([400, 600, 700].map((w) => document.fonts.load(`${w} 20px "${family}"`)));
}
const loadImg = (url) => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
function save(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  URL.revokeObjectURL(a.href);
}

/**
 * Ask for a single name. Resolves to the trimmed name, or null if the user
 * backed out — Cancel, Esc, or dismissing the dialog all land in the same
 * place, so no caller has to know which one happened.
 *
 * Deliberately not a prompt(): see the dialog's markup for why.
 */
function askName({ title, lead, label, value = '', placeholder = '', confirm = 'Create' }) {
  const dlg = $('nameDlg');
  const field = $('nameField');
  $('nameTitle').textContent = title;
  $('nameLead').textContent = lead || '';
  $('nameLead').hidden = !lead;
  $('nameLabel').textContent = label;
  $('nameGo').textContent = confirm;
  field.value = value;
  field.placeholder = placeholder;

  return new Promise((resolve) => {
    let result = null;
    $('nameCancel').onclick = () => dlg.close();
    $('nameGo').onclick = () => {
      const v = field.value.trim();
      // A nameless project is a row the user cannot tell from any other. Keep
      // them in the field rather than creating one and making them fix it.
      if (!v) { field.focus(); return; }
      result = v;
      dlg.close();
    };
    // Enter submits, as it did in the dialog this replaces. Losing that would
    // make the common case slower than what it replaced.
    //
    // Escape is handled explicitly rather than left to <dialog>: the native
    // cancel does not fire in every embedding (measured — the key reaches the
    // page, no `cancel` event, dialog stays open), and a modal with no keyboard
    // way out is a trap. Calling close() twice is a no-op, so this is safe
    // where the native behaviour does work.
    dlg.onkeydown = (e) => {
      if (e.key === 'Enter' && e.target === field) { e.preventDefault(); $('nameGo').click(); }
      if (e.key === 'Escape') { e.preventDefault(); dlg.close(); }
    };
    // One exit point: `close` fires for the button, for Esc and for close()
    // called anywhere else, so the promise can never be left hanging.
    dlg.addEventListener('close', () => resolve(result), { once: true });
    dlg.showModal();
    field.focus();
    field.select();
  });
}

/**
 * "Upload plan": open the file picker immediately, then go to the upload page
 * with the file already in hand.
 *
 * The picker has to be opened from this click. A file dialog needs a real user
 * gesture, and arriving on a new page is not one — calling click() there is
 * ignored without even an error, so "navigate, then auto-open" cannot work.
 * The file travels in the artifact store, which already carries every other
 * per-floor blob, rather than through the URL.
 *
 * Cancelling the picker leaves you here, which is right: there is nothing to
 * do on an upload page you did not mean to open.
 */
let pendingFloor = null;
function pickPlanFor(projectId, floorId) {
  pendingFloor = { projectId, floorId };
  $('planFile').value = '';      // so re-picking the same file still fires
  $('planFile').click();
}
$('planFile').onchange = async () => {
  const file = $('planFile').files[0];
  if (!file || !pendingFloor) return;
  const { projectId, floorId } = pendingFloor;
  pendingFloor = null;
  await putArtifact(scopeFor(projectId, floorId), 'pending', file);
  location.href = floorHref('extract.html', projectId, floorId);
};

/**
 * Every sign-off on this floor, newest first, each with what changed from the
 * one before it.
 *
 * Only the RECORD is compared: room names, dimensions, the space count and the
 * listing figures. The drawing itself cannot be diffed — there is no geometry,
 * only a raster — but those fields are what a builder means when they ask what
 * changed, and they are what the verification report attests to.
 */
function showHistory(project, floor) {
  const dlg = $('histDlg');
  const list = $('histList');
  const vs = floor.versions || [];
  $('histTitle').textContent = `${floor.name} · ${project.name}`;
  $('histLead').textContent = `${vs.length} sign-off${vs.length === 1 ? '' : 's'}. Each entry shows what changed from the one before it.`;
  list.innerHTML = '';

  for (let i = vs.length - 1; i >= 0; i--) {
    const v = vs[i];
    const changes = i > 0 ? diffVersions(vs[i - 1], v) : [];
    const el = document.createElement('div');
    el.className = 'hist-v';
    const when = v.at ? new Date(v.at).toLocaleString(undefined,
      { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }) : 'date unknown';
    el.innerHTML = `<h4>Version ${i + 1}${i === vs.length - 1 ? ' · current' : ''}</h4>`
      + `<div class="when">${esc(v.by || 'the account holder')} · ${esc(when)}</div>`;
    if (i === 0) {
      el.innerHTML += '<div class="same">First sign-off.</div>';
    } else if (!changes.length) {
      el.innerHTML += '<div class="same">Re-confirmed with no change to the record.</div>';
    } else {
      el.innerHTML += `<ul>${changes.map((c) => `<li>${esc(c.text)}</li>`).join('')}</ul>`;
    }
    list.append(el);
  }

  $('histClose').onclick = () => dlg.close();
  // Never rely on the native Escape: it does not fire in every embedding.
  dlg.onkeydown = (e) => { if (e.key === 'Escape') { e.preventDefault(); dlg.close(); } };
  dlg.showModal();
  $('histClose').focus();
}

$('newProject').onclick = async () => {
  // A PROJECT BELONGS TO AN ACCOUNT, so it should not be possible to start one
  // without saying whose it is. Building real work signed out means it lives in
  // this browser alone: no sync, no other device, and nothing to bring it back
  // when the browser is cleared. Saman asked why the app allowed it, and the
  // honest answer was that nothing stopped it.
  //
  // "Try a sample" on the empty state is deliberately NOT gated. It is the
  // door for someone deciding whether to start at all, and it is labelled as a
  // demo — so the trial path survives while real work gets an owner. Both
  // buttons named "New project" come through here, so this is the only gate
  // needed.
  if (!authState().user) {
    openSignIn('in', 'Sign in to start a project, so it is saved to your account.', 'info');
    return;
  }
  const name = await askName({
    title: 'New project',
    lead: 'One project is one home model. Its floors share a brand kit.',
    label: 'Project name',
    // No prefilled "New Model": a default that is already valid gets accepted
    // as-is, and a list of models all called New Model is the result. A
    // placeholder shows the shape of an answer without supplying one.
    placeholder: 'e.g. The Aspen',
    confirm: 'Create project',
  });
  if (name) { store.createProject(name, store.getActiveKit()?.id); render(); }
};

/**
 * Reuse a verified floor in another project — "verify once, reuse forever".
 *
 * The destination is a PROJECT because the brand kit lives there, and producing
 * the same home for a different brand is the whole point. The styled render is
 * deliberately not carried over: the new project has its own kit and palette, so
 * showing the old image would be showing another brand's work.
 */
/**
 * Ask where a verified plan should be reused, then copy it there.
 *
 * The destination is chosen from a list of real projects, not typed as a number
 * into a text box. A control should map onto the thing it changes; if it needs
 * an instruction to operate, the mapping is wrong.
 */
function reuseFloorFlow(srcProject, srcFloor, panel) {
  const dlg = $('reuseDlg');
  const list = $('reuseList');
  const nameField = $('reuseNew');
  const others = store.getProjects().filter((x) => x.id !== srcProject.id && !x.archived);

  $('reuseTitle').textContent = `Copy "${srcFloor.name}" to another project`;
  // SAY WHAT IT IS FOR, not only what travels with it. The old line described
  // the mechanism to someone who had already decided; it never said why anyone
  // would press this. The case is the same house model on another lot — the
  // handoff calls it "verify once, reuse forever" — and what the customer
  // actually saves is the upload, the review, and the credit.
  $('reuseLead').textContent =
    'Put this confirmed floor into another project: the same model on a '
    + 'different lot. Its plan, labels and figures come with it. Nothing to '
    + 'upload, nothing to review again.';
  list.innerHTML = '';
  nameField.value = '';
  let chosen = null;

  const select = (project, btn) => {
    chosen = project;
    nameField.value = '';
    for (const b of list.querySelectorAll('.reuse-opt')) b.setAttribute('aria-pressed', 'false');
    if (btn) btn.setAttribute('aria-pressed', 'true');
  };

  // ONE SENTENCE, NOT TWO SAYING THE SAME THING. With no other projects the
  // dialog said "No other projects yet. Name a new one below." and then
  // labelled the field "Or start a new project" — and "or" pointed at a first
  // option that was not on screen. When naming a project is the only path, it
  // is not an alternative to anything.
  $('reuseNewLabel').textContent = others.length
    ? 'Or start a new project'
    : 'Name the new project';
  if (!others.length) {
    const empty = document.createElement('p');
    empty.className = 'reuse-empty';
    empty.textContent = 'This is your only project so far.';
    list.append(empty);
  }
  for (const p of others) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'reuse-opt';
    btn.setAttribute('aria-pressed', 'false');
    const n = p.floors.length;
    btn.innerHTML = `<b>${esc(p.name)}</b><span class="meta">${n} floor${n === 1 ? '' : 's'}</span>`;
    btn.onclick = () => select(p, btn);
    list.append(btn);
  }

  // Typing a new name is itself a choice — it clears any selected project, so
  // the two inputs can never both look active.
  nameField.oninput = () => {
    if (!nameField.value.trim()) return;
    chosen = null;
    for (const b of list.querySelectorAll('.reuse-opt')) b.setAttribute('aria-pressed', 'false');
  };

  $('reuseCancel').onclick = () => dlg.close();
  // Same reason as the name dialog: never rely on the native Escape.
  dlg.onkeydown = (e) => { if (e.key === 'Escape') { e.preventDefault(); dlg.close(); } };
  $('reuseGo').onclick = async () => {
    const newName = nameField.value.trim();
    if (!chosen && !newName) { nameField.focus(); return; }
    dlg.close();
    await doReuse(srcProject, srcFloor, panel, chosen, newName);
  };

  dlg.showModal();
  (list.querySelector('.reuse-opt') || nameField).focus();
}

async function doReuse(srcProject, srcFloor, panel, existing, newName) {
  const busy = panel.querySelector('.busy') || panel;
  busy.textContent = 'Copying the verified plan…';

  let dest = existing;
  if (!dest) {
    dest = store.createProject(newName, srcProject.brandKitId);
    // A new project is born with one empty floor. The user asked for a home to
    // be REUSED here, not for a blank one to fill in, so the placeholder goes
    // BEFORE the real floor arrives — removing it afterwards let the reused
    // floor collide with it and land as "Main Floor (2)" in a project that
    // then contained no "Main Floor" at all.
    const placeholderId = dest?.floors?.[0]?.id;
    if (placeholderId) store.removeFloor(dest.id, placeholderId);
  }
  if (!dest) { busy.textContent = 'Could not create that project.'; return; }

  // THE PERSON, NOT THE COMPANY. The verification report's headline is
  // "Reviewed and confirmed by X", which is a claim about WHO checked the
  // numbers -- red line 7 is about making process claims honestly, and a
  // company name is not a person. review.html was changed to signOffName()
  // when auth landed; this path was missed, so reusing a floor re-stamped
  // the sign-off with the active brand kit's company name and quietly
  // replaced the reviewer's name on the document.
  //
  // The old value stays as the last fallback rather than being dropped: a
  // signed-out session still has to produce something, and the floor's own
  // existing confirmedBy is truer than nothing.
  const who = (await signOffName())
    || srcFloor.verified?.confirmedBy
    || store.getActiveKit()?.companyName;
  const res = store.reuseFloor(srcProject.id, srcFloor.id, dest.id, who);
  if (!res) { busy.textContent = 'Could not reuse that floor.'; return; }

  // THE RENDER TRAVELS WHEN THE BRAND KIT DOES.
  //
  // This dropped the styled render unconditionally, on the reasoning that it
  // "was made with the OLD project's palette and kit". That reasoning does not
  // hold for the case people actually use: a copy into a NEW project inherits
  // srcProject.brandKitId, so the destination's kit is the same kit, and the
  // render is exactly as valid as it was a second earlier.
  //
  // The visible cost was the whole point of the feature. Copy a floor you had
  // confirmed AND styled, and the new project's pack came out carrying a
  // placeholder — "verify once, reuse forever" delivering neither. It read as a
  // missing render because it was one: we had just deleted it.
  //
  // So the test is the kit, not the act. Same kit, the render comes along and
  // the new project is ready to download. Different kit, it goes — that palette
  // really would be wrong, and Studio re-renders it for the price of one credit
  // rather than shipping the wrong colours silently.
  const copied = await copyScope(res.sourceScope, res.scope);
  const sameKit = dest.brandKitId === srcProject.brandKitId;
  if (!sameKit) {
    for (const kind of STYLED_KINDS) await deleteArtifact(res.scope, kind);
  }

  // Show the result where it landed. A message beside the SOURCE card said the
  // work had happened somewhere else on the page and left the user to find it.
  await render();
  const card = document.querySelector(`[data-project="${dest.id}"]`);
  if (card) {
    card.classList.add('just-added');
    card.scrollIntoView({ block: 'center',
      behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    const note = card.querySelector('.busy');
    if (note) note.textContent =
      `"${srcFloor.name}" reused. ${copied} image${copied === 1 ? '' : 's'} copied, ready to style.`;
  }
}

// ---- backup and restore
const note = (msg) => { $('backupNote').textContent = msg; };

$('backup').onclick = async () => {
  $('backup').disabled = true;
  try {
    note('Packing…');
    const blob = await exportBackup(note);
    const stamp = new Date().toISOString().slice(0, 10);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `styloplan-backup-${stamp}.json`;
    a.click();
    URL.revokeObjectURL(a.href);
    const mb = (blob.size / 1048576).toFixed(1);
    note(`Backup saved (${mb} MB). Keep it somewhere other than this computer.`);
  } catch (e) {
    note(`Backup failed: ${e.message}`);
  } finally {
    $('backup').disabled = false;
  }
};

$('restore').onclick = () => { $('restoreFile').value = ''; $('restoreFile').click(); };

$('restoreFile').onchange = async () => {
  const file = $('restoreFile').files[0];
  if (!file) return;
  try {
    // Read and validate first, and tell the user what will be overwritten
    // BEFORE anything is written. A restore replaces projects by id, and that
    // is not something to do on the strength of a filename.
    const found = await inspectBackup(file);
    const when = found.exportedAt ? new Date(found.exportedAt).toLocaleString() : 'an unknown date';
    const lines = [
      `This backup was made on ${when}.`,
      '',
      `Projects: ${found.projects}   Brand kits: ${found.kits}   Images: ${found.images}`,
      '',
      found.overwrites
        ? `${found.overwrites} project${found.overwrites > 1 ? 's' : ''} already here will be REPLACED, and ${found.adds} added.`
        : `${found.adds} project${found.adds === 1 ? '' : 's'} will be added. Nothing already here is replaced.`,
      '',
      'Restore now?',
    ];
    const go = await askConfirm({
      title: 'Restore this backup?',
      body: lines.filter(Boolean),
      confirm: 'Restore',
      danger: found.overwrites > 0,
    });
    if (!go) { note('Restore cancelled.'); return; }
    const done = await restoreBackup(found, note);
    note(`Restored ${done.projects} project${done.projects === 1 ? '' : 's'}, `
      + `${done.kits} brand kit${done.kits === 1 ? '' : 's'} and `
      + `${done.images} image${done.images === 1 ? '' : 's'}.`);
    render();
  } catch (e) {
    note(`Restore failed: ${e.message}`);
  }
};

render();

// REDRAW WHEN THE ACCOUNT ARRIVES.
//
// Signing in pulls the projects down, and this page had no way to hear about
// it: the list stayed exactly as empty as it was a moment before, and the only
// way to see your own work was to click the SP mark and load the page again.
// Saman found it that way.
//
// It fires TWICE on a sign-in and both are wanted — once when the records land
// and once when the images have been fetched, which is what turns "no plan yet"
// back into a thumbnail.
//
// GUARDED ON THE IDENTITY, not on every publish. `onAuthChange` also fires for
// the credit count, and redrawing the whole list each time a credit is spent
// would throw away scroll position and any open row for nothing.
//
// Seeded from the state we already have, because `onAuthChange` calls back
// immediately once auth is known: starting these at null would count that
// first callback as a change and render the list a second time on every load.
//
// THE SIGNATURE INCLUDES THE SYNC, and leaving it out is why the first attempt
// at this did not work. Signing in publishes three times: the user arrives, then
// the records land, then the images do. Guarding on the identity alone caught
// only the FIRST — which happens BEFORE syncCloud has pulled anything, so the
// list redrew while it was still empty and never drew again. Saman still had to
// click the SP mark.
//
// Credits are deliberately not in it: they change while someone renders, and
// rebuilding every tile then would throw away scroll position for nothing.
//
// AND IT REDRAWS ONCE, NOT THREE TIMES. Rendering on the identity as well meant
// a redraw the instant the user arrived -- before syncCloud had pulled anything
// -- then another when the records landed and a third when the images did.
// Three full rebuilds of every tile in a row is the flicker Saman saw on
// opening the page. The identity alone changes nothing this list can show, so
// it is not a reason to rebuild: the records landing is.
//
// Signing OUT is not handled here either, and does not need to be: it navigates
// away or reloads (see leaveAfterSignOut).
//
// AND THE REAL TEST IS WHETHER THE DATA MOVED, not whether an event fired.
// Guarding on the sync alone still rebuilt the whole list twice on every visit
// — once when the records landed and once when the images did — even on a
// machine where the sync changed nothing at all, which is the usual case and
// exactly when a rebuild is most visible as a flash. So the list is redrawn
// only when what it DRAWS is different.
const dataSig = () => store.getProjects()
  .map((p) => `${p.id}:${p.updatedAt || ''}:${p.archived ? 1 : 0}:`
    + (p.floors || []).map((f) => f.id).join(','))
  .join('|');
const sig = (s) => `${s.sync?.ok ?? ''}|${s.sync?.restored ?? ''}`;
let lastSig = sig(authState());
let lastData = dataSig();
// render() is async and rebuilds every tile; two overlapping runs interleave
// their appends. One at a time, and one more queued at most.
let drawing = null;
let queued = false;
const redraw = () => {
  if (drawing) { queued = true; return; }
  drawing = Promise.resolve(render()).finally(() => {
    drawing = null;
    if (queued) { queued = false; redraw(); }
  });
};
onAuthChange((s) => {
  const next = sig(s);
  if (next === lastSig) return;
  lastSig = next;
  const data = dataSig();
  // Images arriving change no record, and they are the other half of what the
  // tiles show — so a restore redraws even when the data signature is equal.
  const restored = Number(s.sync?.restored || 0) > 0;
  if (data === lastData && !restored) return;
  lastData = data;
  redraw();
});
</script>
</body>
</html>
